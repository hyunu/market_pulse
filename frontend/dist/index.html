<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketPulse — Phase 1</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
        color: var(--fg);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #0c4a6e 0%, transparent 50%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 40rem; text-align: center; }
      h1 {
        font-family: "Fraunces", "Noto Serif KR", Georgia, serif;
        font-weight: 600;
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
      a {
        color: var(--bg);
        background: var(--accent);
        text-decoration: none;
        padding: 0.7rem 1.2rem;
        border-radius: 0.35rem;
        font-weight: 600;
        display: inline-block;
      }
      .meta { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>MarketPulse</h1>
      <p>
        Phase 1 데이터 기반 플레이스홀더입니다. API·DB·수집기 기동을 확인한 뒤
        Phase 2에서 대시보드를 구현합니다.
      </p>
      <a href="http://localhost:8000/health">API Health 확인</a>
      <p class="meta">프론트 풀 UI는 Phase 2 범위입니다 · <a href="http://localhost:8000/docs" style="background:transparent;color:var(--accent);padding:0">OpenAPI /docs</a></p>
    </main>
  </body>
</html>
